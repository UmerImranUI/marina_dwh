version: 2

models:

  - name: stg_vendor_orders__work_orders
    description: >
      Cleans and standardizes raw vendor work orders,
      including service category and UTC timestamps.

    columns:

      - name: work_order_id
        description: Unique work order identifier.
        tests:
          - unique
          - not_null

      - name: vendor_name
        tests:
          - not_null

      - name: hours_spent
        tests:
          - not_null

      - name: status
        tests:
          - accepted_values:
              arguments:
                values:
                  - COMPLETED
                  - IN PROGRESS

      - name: created_at_utc
        tests:
          - not_null

      - name: completed_at_utc

      - name: service_category
        tests:
          - not_null