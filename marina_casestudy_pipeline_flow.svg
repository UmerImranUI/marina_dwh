<svg width="1400" height="546" viewBox="0 0 1400 546" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5b6b76"/>
</marker>
</defs>
<rect x="0" y="0" width="1400" height="546" fill="#ffffff"/>
<rect x="0" y="0" width="1400" height="76" fill="#0f2a3a"/><text x="40" y="34" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Data Pipeline Architecture</text><text x="40" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b9d3de" text-anchor="start">Raw sources -&gt; staging -&gt; intermediate entity matching -&gt; final reporting views</text><rect x="90.0" y="170" width="260" height="220" rx="14" fill="#eef2f3" stroke="#8fa3ab" stroke-width="2"/><text x="220.0" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4a5a63" text-anchor="middle">1. RAW SOURCES</text><text x="108.0" y="204" font-family="Consolas, Menlo, monospace" font-size="11.8" font-weight="600" fill="#0f2a3a" text-anchor="start">raw_marina_pms</text><text x="108.0" y="226" font-family="Consolas, Menlo, monospace" font-size="11.8" font-weight="600" fill="#0f2a3a" text-anchor="start">raw_vendor_work_orders</text><text x="108.0" y="248" font-family="Consolas, Menlo, monospace" font-size="11.8" font-weight="600" fill="#0f2a3a" text-anchor="start">raw_stripe_subscriptions</text><line x1="108.0" y1="278" x2="332.0" y2="278" stroke="#8fa3ab" stroke-width="1" opacity="0.5"/><text x="108.0" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">Fragmented, dirty data</text><text x="108.0" y="317" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">across 3 source systems</text><rect x="410.0" y="170" width="260" height="220" rx="14" fill="#dceef2" stroke="#4a90a4" stroke-width="2"/><text x="540.0" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4a5a63" text-anchor="middle">2. STAGING</text><text x="428.0" y="204" font-family="Consolas, Menlo, monospace" font-size="11.8" font-weight="600" fill="#0b4a5c" text-anchor="start">stg_marina_pms__bookings</text><text x="428.0" y="226" font-family="Consolas, Menlo, monospace" font-size="11.8" font-weight="600" fill="#0b4a5c" text-anchor="start">stg_vendor_orders__work_orders</text><line x1="428.0" y1="256" x2="652.0" y2="256" stroke="#4a90a4" stroke-width="1" opacity="0.5"/><text x="428.0" y="278" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">Clean &amp; standardize:</text><text x="428.0" y="295" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">currency, dates (UTC),</text><text x="428.0" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">service categories</text><rect x="730.0" y="170" width="260" height="220" rx="14" fill="#e4dcf3" stroke="#7b5cb0" stroke-width="2"/><text x="860.0" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4a5a63" text-anchor="middle">3. INTERMEDIATE</text><text x="748.0" y="204" font-family="Consolas, Menlo, monospace" font-size="11.8" font-weight="600" fill="#3a1f66" text-anchor="start">int_owners</text><text x="748.0" y="226" font-family="Consolas, Menlo, monospace" font-size="11.8" font-weight="600" fill="#3a1f66" text-anchor="start">int_boats</text><line x1="748.0" y1="256" x2="972.0" y2="256" stroke="#7b5cb0" stroke-width="1" opacity="0.5"/><text x="748.0" y="278" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">Entity matching:</text><text x="748.0" y="295" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">dedupe owners &amp; boats,</text><text x="748.0" y="312" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">generate surrogate keys</text><rect x="1050.0" y="170" width="260" height="220" rx="14" fill="#dcece0" stroke="#3f8f5b" stroke-width="2"/><text x="1180.0" y="154" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#4a5a63" text-anchor="middle">4. REPORTING</text><text x="1068.0" y="204" font-family="Consolas, Menlo, monospace" font-size="11.8" font-weight="600" fill="#1f5c34" text-anchor="start">mrt_executive_kpis</text><line x1="1068.0" y1="234" x2="1292.0" y2="234" stroke="#3f8f5b" stroke-width="1" opacity="0.5"/><text x="1068.0" y="256" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">Presentation mart:</text><text x="1068.0" y="273" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">MRR/ARR, utilization,</text><text x="1068.0" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#3a4a55" text-anchor="start">response time</text><line x1="356.0" y1="280.0" x2="404.0" y2="280.0" stroke="#5b6b76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="676.0" y1="280.0" x2="724.0" y2="280.0" stroke="#5b6b76" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="996.0" y1="280.0" x2="1044.0" y2="280.0" stroke="#5b6b76" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="20" y="460" width="1360" height="56" rx="10" fill="#f7f7f5" stroke="#dcdcd8" stroke-width="1"/><text x="40" y="484" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#4a4a4a" text-anchor="start">Each transition is a dbt model boundary, tested with dbt test (unique, not_null, relationships).</text><text x="40" y="502" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#6a6a66" text-anchor="start">Materialization: staging = view, intermediate/reporting = table, clustered for scale.</text>
</svg>